[project]
name = "dq-agent"
version = "0.1.0"
description = "Agentic data quality diagnosis assistant (LangGraph + DuckDB)"
authors = [
    { name = "Yufei Zhang", email = "zhyufei22@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "duckdb>=1.5.6",
    "fastapi>=0.143.0",
    "langchain-openai>=1.7.0",
    "langgraph>=1.2.14",
    "langgraph-checkpoint-sqlite>=3.1.1",
    "pandas>=3.0.6",
    "pandera>=0.34.1",
    "pyarrow>=25.0.1",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
    "sqlglot>=30.21.0",
    "streamlit>=1.65.0",
    "uvicorn[standard]>=0.54.0",
]

[project.scripts]
dq-agent = "dq_agent.cli:main"

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.16.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
